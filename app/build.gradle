plugins {
    id "com.android.application"
}

android {
    namespace "com.iso2cso.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.iso2cso.app"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "2.1"
    }

    // Release builds use the key named by ISO2CSO_KEYSTORE (CI decodes it from
    // the SIGNING_KEYSTORE_B64 secret) so every APK installs as an update over
    // the last. Without it they fall back to the debug key.
    def ks = System.getenv("ISO2CSO_KEYSTORE")
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ISO2CSO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ISO2CSO_KEY_ALIAS")
                keyPassword System.getenv("ISO2CSO_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
