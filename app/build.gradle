plugins {
    id "com.android.application"
}

android {
    namespace "app.squishiso"
    compileSdk 35

    defaultConfig {
        applicationId "app.squishiso"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // Release builds use the key named by SQUISH_KEYSTORE (CI decodes it from
    // the SIGNING_KEYSTORE_B64 secret) so every APK installs as an update over
    // the last. Without it they fall back to the debug key.
    def ks = System.getenv("SQUISH_KEYSTORE")
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("SQUISH_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SQUISH_KEY_ALIAS")
                keyPassword System.getenv("SQUISH_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        // Fail the release build on any API call that doesn't exist on minSdk.
        fatal "NewApi"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
